<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>장바구니 배열 관리하기</h1>
    <p>배열 메서드를 활용하여 장바구니 기능을 구현합니다.</p>
    <script>
      const cart = [];
      cart.push({ name: "냉장고", price: 2000000 });
      cart.push({ name: "tv", price: 1500000 });
      cart.push({ name: "침대", price: 10000000 });
      console.log(cart);

      const index = cart.findIndex((item) => item.name === "tv");

      if (index !== -1) {
        cart.splice(index, 1);
      }
      console.log(cart);

      console.log(cart.map((i) => i.name).join(","));

      cart.sort((a, b) => a.price - b.price);
      console.log(cart.map((i) => i.name).join(","));

      const sortedCart = [...cart].sort((a, b) => b.price - a.price);
      console.log(sortedCart.map((i) => i.name).join(","));
    </script>
  </body>
</html>
