    <p>객체를 활용하여 학생 정보를 관리하고 동적으로 접근합니다.</p>
    <ul>
      <li>1. 학생 객체 생성 (name, age, scores: {math, english})</li>

      <script>
        function getProperty(obj, key) {
          return obj[key];
        }
        function averageScore(scores) {
          let sum = 0;
          let count = 0;

          for (let key in scores) {
            sum += scores[key];
            count++;
          }
          return sum / count;
        }
