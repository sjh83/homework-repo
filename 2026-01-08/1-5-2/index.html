<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>카페 주문 흐름 시뮬레이션</h1>
    <h2>
      손님(동기), 주문(비동기), VIP(마이크로태스크)가 섞여있는 상황을 코드로
      작성하고 실행 순서를 검증해보세요!
    </h2>

    <ul>
      요구사항
      <li>위 코드를 실행했을 때 콘솔에 출력될 순서를 적으세요.</li>
      <li>왜 "일반 손님"보다 "VIP"가 먼저 나오는지 설명하세요.</li>
      <li>setTimeout 시간을 1초로 늘리면 순서가 어떻게 변할지 예측해보세요.</li>
    </ul>

    <script>
      console.log("1. 가게 오픈");

      setTimeout(() => {
        console.log("2. 일반 손님 주문 완료");
      }, 0);

      Promise.resolve().then(() => {
        console.log("3. VIP 손님 입장");
      });

      console.log("4. 재료 준비");

      // 1. → 4. → 3. → 2 순서대로 나올 거 같음
      // 동기순서대로 위에서 밑으로 1, 4번이 실행됨
      // 2,3번은 비동기로 병렬로 실행해 우선순위 밀림 동기 끝나고 진행
      // 3번이 2번 보다 먼저 실행되는 이유는 마이크로태스크가 매크로태스크보다 우선 실행되기 때문
      // 마이크로태스크 먼저 실행 매크로태스크 대표적으로 setTimeout과 setInterval이 있고 이벤트핸들러 I/O가 있음
      // 마이크로태스크는 Promise:then/catch/finally, queueMicrotask(직접만든 작업), 돔감지가 있음
      // 실행순서 콜스택 → 마이크로태스크 전부 → 매크로태스크1개 → 반복
      // 요약 JavaScript는 동기 코드 실행 후, 마이크로태스크(Promise)를 모두 처리한 뒤 매크로태스크(setTimeout 등)를 하나씩 처리한다.

      // setTimeout 시간을 1초로 늘리면 순서가 어떻게 변할지 예측해보세요
      // 1초를 늘린다고해서 매크로태스크가 마이크로태스크보다 먼저 실행되지 않는다
      // 결과는 똑같고 마이크로태스크가 전부 끝나고 1초뒤에 매크로태스크가 나온다
    </script>
  </body>
</html>
