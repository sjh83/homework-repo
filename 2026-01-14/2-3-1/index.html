<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>약수 구하기 함수</title>
  </head>
  <body>
    <h1>나머지 연산자(%)를 사용하여 약수를 구하는 함수를 구현합니다.</h1>
    <ul>
      <li>정수 n의 모든 약수를 배열로 반환하는 getDivisors(n) 구현</li>
      <li>약수의 개수를 반환하는 countDivisors(n) 구현</li>
      <li>약수의 합을 반환하는 sumDivisors(n) 구현</li>
      <li>각 함수를 n=12로 테스트</li>
    </ul>
    <script type="module" src="./main.js"></script>
  </body>
</html>
