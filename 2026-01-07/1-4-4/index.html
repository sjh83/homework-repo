<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>this 바인딩 실험하기</h1>
    <p>
      this가 손실되는 상황을 직접 확인하고, bind와 화살표 함수로 해결하는 방법을
      실습합니다.
    </p>
    <!-- 
    const hero = {
        name: 'Batman',
        call() {
            console.log(this.name);
        }
    };

    // 1.this 손실(undefined)
    const stolenCall = hero.call;
    stolenCall();

    // 2. bind로 해결하기
    const fixedCall = ???;
    fixedCall();
    -->
    <ul>
      요구사항
      <li>'stolenCall' 실행 시 'undefined'가 나오는 이유 주석 달기</li>
      <li>'fixedCall' 변수에 bind를 사용해서 해결책 작성하기</li>
      <li>'setTimeout'안에서 'this' 잃어버리는 예제 하나 더 만들기</li>
    </ul>
    <script>
      /* const hero = {
        name: 'Batman',
        call() {
            console.log(this.name);
        }
    };

    // 1.this 손실(undefined)
    const stolenCall = hero.call;
    stolenCall();

    // 2. bind로 해결하기
    const fixedCall = ???;
    fixedCall(); */

      const hero = {
        name: "Batma",
        call() {
          console.log(this.name);
        },
      };
      /* 'stolenCall'실행 시 undefined가 나오는 이유 */
      /* javaScript에서는 함수 호출 시점에 this가 결정된다
       * hero.call을 변수에 할당하면 객체와 끊어져 일반함수 호출이 되고
       * this.name undefined가 된다
       * 예외로 화살표함수만 정의 시점에 this가 결정된다(상위스코프 this 사용)
       */
      const fixedCall = hero.call.bind(hero);

      /* console.log(fixedCall()); */
      fixedCall();
    </script>
  </body>
</html>
